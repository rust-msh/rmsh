[package]
name = "rcad-render"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/cad-rs/rcad"

[dependencies]
wgpu.workspace = true
rcad-kernel = { path = "../rcad-kernel" }
rcad-algorithms = { path = "../rcad-algorithms" }
glam.workspace = true
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
rcad-algorithms = { path = "../rcad-algorithms" }
rcad-modeling = { path = "../rcad-modeling" }
