[workspace]
members = [
    "crates/model",
    "crates/geo",
    "crates/io",
    "crates/algo",
    "crates/rcad-bridge",
]
default-members = [
    "crates/model",
    "crates/geo",
    "crates/io",
    "crates/algo",
    "crates/rcad-bridge",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# Internal crates
rmsh-model = { path = "crates/model" }
rmsh-geo = { path = "crates/geo" }
rmsh-io = { path = "crates/io" }
rmsh-algo = { path = "crates/algo" }
rmsh-bridge = { path = "crates/rcad-bridge" }
rmsh-renderer = { path = "crates/renderer" }

# RCAD — the open-source rcad this project is built on, consumed from the
# local monorepo checkout (the published standalone repo predates the
# monorepo merge; the old rcad-algorithms package is now rcad-algo).
rcad-kernel = { path = "../rcad/libs/rcad-kernel" }
rcad-modeling = { path = "../rcad/libs/rcad-modeling" }
rcad-algo = { path = "../rcad/libs/rcad-algo" }
rcad-step = { path = "../rcad/libs/rcad-step" }
rcad-render = { path = "../rcad/libs/rcad-render" }
rcad-scene = { path = "../rcad/libs/rcad-scene" }
rcad-mesh = { path = "../rcad/libs/rcad-mesh" }

# Math
nalgebra = { version = "0.33", features = ["serde-serialize"] }
glam = { version = "0.29", features = ["serde"] }

# Graphics
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }

# UI
egui = "0.33"
eframe = { version = "0.33", default-features = false }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive", "rc"] }

# File dialog
rfd = "0.15"
pollster = "0.4"

# Web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
