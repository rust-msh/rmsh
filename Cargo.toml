[workspace]
members = [
    "crates/app",
    "crates/components",
    "crates/domain",
    "crates/infra",
    "crates/render",
    "crates/solver",
    "crates/touchstone",
    "crates/main",
    "crates/worker",
    "examples/field-vis",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["emstudio team"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
egui_table = "0.7"
egui_tiles = "0.14"
egui_extras = "0.33"
egui_plot = "0.34"
egui_dock = "0.18"
egui-wgpu = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "27"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
tracing = "0.1"
glam = { version = "0.29", features = ["serde"] }
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
rmp-serde = "1"
tempfile = "3"
pollster = "0.4"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = "0.4"
log = "0.4"
env_logger = "0.11"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
rmetis = { path = "vendor/rem/vendor/rmetis", default-features = false }

# rcad geometry kernel (git submodule at vendor/rcad)
rcad-kernel = { path = "vendor/rcad/libs/rcad-kernel" }
rcad-modeling = { path = "vendor/rcad/libs/rcad-modeling" }
rcad-algorithms = { path = "vendor/rcad/libs/rcad-algorithms" }
rcad-render = { path = "vendor/rcad/libs/rcad-render" }
rcad-step = { path = "vendor/rcad/libs/rcad-step" }

# rmsh mesh generation (git submodule at vendor/rmsh)
rmsh-model = { path = "vendor/rmsh/crates/model" }
rmsh-geo = { path = "vendor/rmsh/crates/geo" }
rmsh-io = { path = "vendor/rmsh/crates/io" }
rmsh-algo = { path = "vendor/rmsh/crates/algo" }

# rem electromagnetic solver (git submodule at vendor/rem)
rem-core = { path = "vendor/rem/crates/core" }
rem-config = { path = "vendor/rem/crates/config" }
rem-mesh = { path = "vendor/rem/crates/mesh" }
rem-materials = { path = "vendor/rem/crates/materials" }
rem-bc = { path = "vendor/rem/crates/bc" }
rem-electrostatic = { path = "vendor/rem/crates/electrostatic" }
rem-magnetostatic = { path = "vendor/rem/crates/magnetostatic" }
rem-eigenmode = { path = "vendor/rem/crates/eigenmode" }
rem-driven = { path = "vendor/rem/crates/driven" }
rem-mom = { path = "vendor/rem/crates/mom" }
rem-bem = { path = "vendor/rem/crates/bem" }
rem-sbr = { path = "vendor/rem/crates/sbr" }
rem-result = { path = "vendor/rem/crates/result" }
rem-parallel = { path = "vendor/rem/crates/parallel" }
