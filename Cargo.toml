[workspace]
members = [
    "crates/app",
    "crates/components",
    "crates/domain",
    "crates/infra",
    "crates/render",
    "crates/solver",
    "crates/touchstone",
    "crates/main",
    "crates/worker",
    "examples/field-vis",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["emstudio team"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
egui_table = "0.7"
egui_tiles = "0.14"
egui_extras = "0.33"
egui_plot = "0.33"
egui_dock = "0.18"
egui-wgpu = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "27"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
tracing = "0.1"
glam = "0.29"
js-sys = "0.3"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
rmp-serde = "1"
tempfile = "3"
pollster = "0.4"
