[workspace]
members = [
    "crates/app",
    "crates/components",
    "crates/domain",
    "crates/infra",
    "crates/render",
    "crates/solver",
    "crates/main",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["emstudio team"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
eframe = { version = "0.31" }
egui = "0.31"
egui_plot = "0.35"
egui_dock = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wgpu = "25"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
console_error_panic_hook = "0.1"
tracing = "0.1"
