[package]
name = "rmsh-algo"
version.workspace = true
edition.workspace = true

[dependencies]
rmsh-io = { workspace = true }
rmsh-model = { workspace = true }
thiserror = { workspace = true }
# The geometry-source abstraction (geometry_source.rs) is meshing-facing and
